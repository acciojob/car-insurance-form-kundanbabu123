
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Insurance Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Car Insurance Registration</h1>
        <p>Register your car for insurance</p>

        <form id="insuranceForm" method="post">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Gender</label>
            <div class="gender">
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
            </div>

            <label for="cars">Car Brand</label>
            <select id="cars">
                <option value="">Select Car Brand</option>
                <option value="BMW">BMW</option>
                <option value="Audi">Audi</option>
                <option value="Mercedez">Mercedez</option>
            </select>

            <label for="carage">Car Age</label>
            <input type="number" id="carage" placeholder="Enter car age" required>

            <label for="dop">Date of Purchase</label>
            <input type="date" id="dop" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>

            <button type="submit">Submit Registration</button>

        </form>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
